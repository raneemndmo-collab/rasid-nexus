---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rasid-vault
  namespace: rasid-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rasid-vault-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: rasid-vault
    namespace: rasid-secrets
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: rasid-secrets
data:
  vault-config.hcl: |
    ui = false
    disable_mlock = true
    api_addr = "http://0.0.0.0:8200"

    storage "file" {
      path = "/vault/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }

    default_lease_ttl = "168h"
    max_lease_ttl = "720h"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rasid-vault
  namespace: rasid-secrets
  labels:
    app: rasid-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rasid-vault
  template:
    metadata:
      labels:
        app: rasid-vault
    spec:
      serviceAccountName: rasid-vault
      securityContext:
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: vault
          image: hashicorp/vault:1.15
          command:
            - vault
            - server
            - -dev
            - -dev-root-token-id=rasid-root-token
            - -dev-listen-address=0.0.0.0:8200
          ports:
            - containerPort: 8200
              name: api
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: "rasid-root-token"
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /vault/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rasid-vault
  namespace: rasid-secrets
spec:
  selector:
    app: rasid-vault
  ports:
    - name: api
      port: 8200
      targetPort: 8200
  type: ClusterIP
