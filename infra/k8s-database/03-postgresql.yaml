---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-init-databases
  namespace: rasid-database
data:
  init-databases.sh: |
    #!/bin/bash
    set -e

    DATABASES=(
      "rasid_kernel"
      "rasid_auth"
      "rasid_audit"
      "rasid_documents"
      "rasid_workflow"
      "rasid_notifications"
      "rasid_analytics"
      "rasid_integration"
      "rasid_compliance"
      "rasid_config"
    )

    USERS=(
      "svc_kernel"
      "svc_auth"
      "svc_audit"
      "svc_documents"
      "svc_workflow"
      "svc_notifications"
      "svc_analytics"
      "svc_integration"
      "svc_compliance"
      "svc_config"
    )

    for i in "${!DATABASES[@]}"; do
      DB="${DATABASES[$i]}"
      USER="${USERS[$i]}"
      PASS=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)

      echo "Creating database: $DB with user: $USER"

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        -- Create user with unique password
        CREATE USER ${USER} WITH PASSWORD '${PASS}' NOSUPERUSER NOCREATEDB NOCREATEROLE;

        -- Create database owned by user
        CREATE DATABASE ${DB} OWNER ${USER};

        -- Revoke all public access
        REVOKE ALL ON DATABASE ${DB} FROM PUBLIC;

        -- Grant connect only to owner
        GRANT CONNECT ON DATABASE ${DB} TO ${USER};
    EOSQL

      # Connect to the specific database to set up schema and RLS
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "${DB}" <<-EOSQL
        -- Revoke public schema usage
        REVOKE ALL ON SCHEMA public FROM PUBLIC;
        GRANT USAGE ON SCHEMA public TO ${USER};
        GRANT CREATE ON SCHEMA public TO ${USER};

        -- Set default privileges
        ALTER DEFAULT PRIVILEGES IN SCHEMA public
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO ${USER};

        -- Create tenant isolation table template
        CREATE TABLE IF NOT EXISTS tenant_data (
          id SERIAL PRIMARY KEY,
          tenant_id UUID NOT NULL,
          data JSONB,
          created_at TIMESTAMPTZ DEFAULT NOW(),
          updated_at TIMESTAMPTZ DEFAULT NOW()
        );

        -- Enable RLS
        ALTER TABLE tenant_data ENABLE ROW LEVEL SECURITY;

        -- Force RLS for table owner too
        ALTER TABLE tenant_data FORCE ROW LEVEL SECURITY;

        -- Create RLS policy
        CREATE POLICY tenant_isolation_policy ON tenant_data
          USING (tenant_id = current_setting('app.current_tenant')::UUID)
          WITH CHECK (tenant_id = current_setting('app.current_tenant')::UUID);

        -- Grant table access to service user
        GRANT SELECT, INSERT, UPDATE, DELETE ON tenant_data TO ${USER};
        GRANT USAGE, SELECT ON SEQUENCE tenant_data_id_seq TO ${USER};

        -- Insert test data for two tenants
        SET app.current_tenant = '11111111-1111-1111-1111-111111111111';
        INSERT INTO tenant_data (tenant_id, data) VALUES
          ('11111111-1111-1111-1111-111111111111', '{"module": "${DB}", "tenant": "A"}');

        SET app.current_tenant = '22222222-2222-2222-2222-222222222222';
        INSERT INTO tenant_data (tenant_id, data) VALUES
          ('22222222-2222-2222-2222-222222222222', '{"module": "${DB}", "tenant": "B"}');

        RESET app.current_tenant;
    EOSQL

      echo "Database ${DB} initialized with RLS. User: ${USER}, Pass: ${PASS}"
      echo "${DB}|${USER}|${PASS}" >> /var/lib/postgresql/data/credentials.txt
    done

    echo "All databases initialized successfully"
  pg-hba-custom.conf: |
    # TYPE  DATABASE  USER  ADDRESS    METHOD
    # Reject all non-SSL connections
    hostnossl  all  all  0.0.0.0/0  reject
    hostnossl  all  all  ::/0       reject
    # Allow SSL connections with scram-sha-256
    hostssl    all  all  0.0.0.0/0  scram-sha-256
    hostssl    all  all  ::/0       scram-sha-256
    # Local connections (unix socket)
    local      all  all             scram-sha-256
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-tls-script
  namespace: rasid-database
data:
  generate-certs.sh: |
    #!/bin/sh
    set -e
    cd /tls-output

    # Generate CA
    openssl genrsa -out ca.crt.key 4096
    openssl req -x509 -new -nodes -key ca.crt.key -sha256 -days 3650 \
      -out ca.crt -subj "/CN=RASID-DB-CA/O=RASID/OU=Database"

    # Generate server certificate
    openssl genrsa -out server.key 4096
    openssl req -new -key server.key \
      -out server.csr -subj "/CN=rasid-pg.rasid-database.svc.cluster.local/O=RASID/OU=Database"

    cat > /tmp/server-ext.cnf <<EXTEOF
    authorityKeyIdentifier=keyid,issuer
    basicConstraints=CA:FALSE
    keyUsage=digitalSignature,keyEncipherment
    extendedKeyUsage=serverAuth
    subjectAltName=@alt_names
    [alt_names]
    DNS.1=rasid-pg
    DNS.2=rasid-pg.rasid-database
    DNS.3=rasid-pg.rasid-database.svc
    DNS.4=rasid-pg.rasid-database.svc.cluster.local
    DNS.5=localhost
    IP.1=127.0.0.1
    EXTEOF

    openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.crt.key \
      -CAcreateserial -out server.crt -days 3650 -sha256 \
      -extfile /tmp/server-ext.cnf

    # PostgreSQL requires specific permissions
    chown 70:70 server.key server.crt ca.crt
    chmod 600 server.key
    chmod 644 server.crt ca.crt

    echo "TLS certificates generated"
    ls -la /tls-output/
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
  namespace: rasid-database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: do-block-storage-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rasid-pg
  namespace: rasid-database
  labels:
    app: rasid-pg
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rasid-pg
  template:
    metadata:
      labels:
        app: rasid-pg
        tier: data
    spec:
      initContainers:
      - name: tls-generator
        image: alpine/openssl:latest
        command: ["/bin/sh", "/scripts/generate-certs.sh"]
        volumeMounts:
        - name: tls-certs
          mountPath: /tls-output
        - name: tls-script
          mountPath: /scripts
      containers:
      - name: postgresql
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: "rasid_admin"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pg-admin-secret
              key: password
        - name: POSTGRES_DB
          value: "rasid_admin"
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
        args:
        - "-c"
        - "ssl=on"
        - "-c"
        - "ssl_cert_file=/var/lib/postgresql/tls/server.crt"
        - "-c"
        - "ssl_key_file=/var/lib/postgresql/tls/server.key"
        - "-c"
        - "ssl_ca_file=/var/lib/postgresql/tls/ca.crt"
        - "-c"
        - "ssl_min_protocol_version=TLSv1.3"
        - "-c"
        - "hba_file=/etc/pg-hba/pg-hba-custom.conf"
        - "-c"
        - "password_encryption=scram-sha-256"
        - "-c"
        - "log_connections=on"
        - "-c"
        - "log_disconnections=on"
        - "-c"
        - "log_statement=ddl"
        volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        - name: tls-certs
          mountPath: /var/lib/postgresql/tls
          readOnly: true
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        - name: pg-hba
          mountPath: /etc/pg-hba
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - rasid_admin
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - rasid_admin
          initialDelaySeconds: 30
          periodSeconds: 15
      volumes:
      - name: pg-data
        persistentVolumeClaim:
          claimName: pg-data
      - name: tls-certs
        emptyDir: {}
      - name: tls-script
        configMap:
          name: pg-tls-script
          defaultMode: 0755
      - name: init-scripts
        configMap:
          name: pg-init-databases
          defaultMode: 0755
          items:
          - key: init-databases.sh
            path: init-databases.sh
      - name: pg-hba
        configMap:
          name: pg-init-databases
          items:
          - key: pg-hba-custom.conf
            path: pg-hba-custom.conf
---
apiVersion: v1
kind: Service
metadata:
  name: rasid-pg
  namespace: rasid-database
  labels:
    app: rasid-pg
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: rasid-pg
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-isolation
  namespace: rasid-database
spec:
  podSelector:
    matchLabels:
      app: rasid-pg
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: rasid-database
    ports:
    - protocol: TCP
      port: 5432
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
